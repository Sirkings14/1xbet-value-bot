name: 1xBet Value Engine

on:
  schedule:
    - cron: '*/30 8-23 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**']

concurrency:
  group: 1xbet-value-engine
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py tests/test_engine.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run value scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Persist scanner state
        run: |
          git config user.name "1xBet Value Engine"
          git config user.email "engine@users.noreply.github.com"
          git add sent_alerts_cache.csv signals.csv
          if git diff --cached --quiet; then
            echo "No scanner state changes."
            exit 0
          fi
          git commit -m "Update scanner state [skip ci]"
          git push
