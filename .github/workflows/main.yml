on:
  schedule:
    - cron: '*/30 8-23 * * *'
  workflowdispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quantitative Scanner Engine
        env:
          ODDSAPIKEY: ${{ secrets.ODDSAPIKEY }}
          TELEGRAMTOKEN: ${{ secrets.TELEGRAMTOKEN }}
          TELEGRAMCHATID: ${{ secrets.TELEGRAMCHATID }}
        run: python main.py

      - name: Commit & Push Cache & Bet Ledger
        run: |
          git config --global user.name "1xBet Quantitative Engine"
          git config --global user.email "engine@1xbet-value.com"
          git add sentalertscache.csv bethistory.csv  exit 0
          git commit -m "Updated alert cache and tracking ledger [skip ci]"  exit 0
          git push || exit 0
