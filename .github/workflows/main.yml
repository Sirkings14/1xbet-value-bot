name: 1xBet Value Engine

on:
  schedule:
    - cron: '*/5 8-23 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**']

concurrency:
  group: 1xbet-value-engine
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py settle_signals.py analytics.py signal_quality.py clv.py telegram_healthcheck.py tests/test_engine.py tests/test_settlement.py tests/test_analytics.py tests/test_signal_quality.py tests/test_clv.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rebuild/value-engine-v2') && !contains(github.event.head_commit.message, '[skip ci]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate Telegram configuration
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_healthcheck.py
      - name: Send one-time Telegram delivery test
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "TELEGRAM DELIVERY TEST\n--------------------\nThe 1xBet Value Engine notification path is working.\nThis is a system test — no betting signal."
              },
              timeout=20,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise RuntimeError(payload)
          print("TELEGRAM_TEST: message delivered successfully")
          PY
      - name: Run value scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Capture pre-start CLV
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python clv.py
      - name: Settle completed signals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python settle_signals.py
      - name: Validate signal data
        run: python signal_quality.py
      - name: Generate performance report
        run: python analytics.py
      - name: Persist scanner state and reports
        run: |
          git config user.name "1xBet Value Engine"
          git config user.email "engine@users.noreply.github.com"
          for file in sent_alerts_cache.csv signals.csv clv_snapshots.csv analysis_report.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No scanner state or report changes."
            exit 0
          fi
          git commit -m "Update scanner state and performance report [skip ci]"
          git push
