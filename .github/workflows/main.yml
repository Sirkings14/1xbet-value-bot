name: 1xBet Value Engine

on:
  # Free-tier mode: daily scans, with a no-credit quota preflight and protected reserve.
  schedule:
    - cron: '5 12 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**']

concurrency:
  group: 1xbet-value-engine
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py settle_signals.py analytics.py signal_quality.py clv.py telegram_healthcheck.py tests/test_engine.py tests/test_settlement.py tests/test_analytics.py tests/test_signal_quality.py tests/test_clv.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline settlement and reporting rehearsal (no live odds)
        env:
          SIGNALS_FILE: ${{ runner.temp }}/offline-reconciliation/signals.csv
          MANUAL_RESULTS_FILE: ${{ runner.temp }}/offline-reconciliation/manual_results.csv
          REPORT_FILE: ${{ runner.temp }}/offline-reconciliation/analysis_report.csv
          CLV_FILE: ${{ runner.temp }}/offline-reconciliation/clv_snapshots.csv
        run: |
          mkdir -p "$RUNNER_TEMP/offline-reconciliation"
          cp signals.csv "$SIGNALS_FILE"
          cp manual_results.csv "$MANUAL_RESULTS_FILE"
          python settle_signals.py --manual-only
          python signal_quality.py
          python analytics.py
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          ledger_path = Path(os.environ["SIGNALS_FILE"])
          report_path = Path(os.environ["REPORT_FILE"])
          with ledger_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          with report_path.open(newline="", encoding="utf-8") as handle:
              report = list(csv.DictReader(handle))
          manual_path = Path(os.environ["MANUAL_RESULTS_FILE"])
          with manual_path.open(newline="", encoding="utf-8") as handle:
              manual_results = list(csv.DictReader(handle))
          settled = [row for row in rows if row.get("status") in {"win", "loss", "push"}]
          pending = [row for row in rows if row.get("status") not in {"win", "loss", "push"}]
          overall = next(row for row in report if row["section"] == "overall")
          outcomes = {row["status"] for row in settled}
          manual_event_ids = {row["event_id"] for row in manual_results if row.get("event_id")}
          settled_manual_rows = [row for row in settled if row.get("event_id") in manual_event_ids]
          settled_manual_ids = {row.get("event_id") for row in settled_manual_rows}
          assert manual_event_ids.issubset(settled_manual_ids), (
              f"manual backfill events not settled: {sorted(manual_event_ids - settled_manual_ids)}"
          )
          assert all(row.get("settlement_method") in {"manual_verified", "scores_api"} for row in settled_manual_rows)
          assert all(row.get("settlement_source_url", "").startswith("https://") for row in settled_manual_rows)
          assert int(overall["signals"]) == len(rows)
          assert int(overall["settled"]) == len(settled)
          assert int(overall["pending"]) == len(pending)
          assert sum(row["status"] == "win" for row in settled) == int(overall["wins"])
          assert sum(row["status"] == "loss" for row in settled) == int(overall["losses"])
          assert sum(row["status"] == "push" for row in settled) == int(overall["pushes"])
          print("OFFLINE_RECONCILIATION_ASSERTIONS: PASS")
          print(f"Signals: {len(rows)} | Verified manual-result events: {len(settled_manual_ids)} | Pending: {len(pending)} | Outcomes: {dict((x, sum(r['status'] == x for r in settled)) for x in sorted(outcomes))}")
          print(f"Paper P/L: {overall['profit_units']} stake-pct units | ROI: {overall['roi_percent']}%")
          PY
      - name: Upload offline reconciliation output
        uses: actions/upload-artifact@v4
        with:
          name: offline-reconciliation-output
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/offline-reconciliation/signals.csv
            ${{ runner.temp }}/offline-reconciliation/analysis_report.csv

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate Telegram configuration
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_healthcheck.py
      - name: Send one-time Telegram delivery test
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "TELEGRAM DELIVERY TEST\n--------------------\nThe 1xBet Value Engine notification path is working.\nThis is a system test — no betting signal."
              },
              timeout=20,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise RuntimeError(payload)
          print("TELEGRAM_TEST: message delivered successfully")
          PY
      - name: Run value scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Capture pre-start CLV
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python clv.py
      - name: Validate signal data
        run: python signal_quality.py
      - name: Generate performance report
        run: python analytics.py
      - name: Persist scanner state and reports
        run: |
          git config user.name "1xBet Value Engine"
          git config user.email "engine@users.noreply.github.com"
          for file in sent_alerts_cache.csv signals.csv clv_snapshots.csv analysis_report.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No scanner state or report changes."
            exit 0
          fi
          git commit -m "Update scanner state and performance report [skip ci]"
          git push
